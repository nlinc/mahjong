name: Check and publish mahjong Hosting
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify-process.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: mahjong-hosting-${{ github.sha }}
          path: .hosting-release
      - name: Check intended source-bound artifact before publication
        run: node scripts/hosting-release.mjs check .hosting-release "$GITHUB_SHA"
      - name: Copy verified artifact for Firebase CLI metadata
        run: test ! -e .hosting-deploy && cp -R .hosting-release .hosting-deploy
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: hosting
        with:
          entryPoint: .hosting-deploy
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAHJONG_LINCOLN }}
          projectId: mahjong-lincoln
          channelId: live
      - name: Verify every intended served asset and canonical root
        run: node scripts/hosting-release.mjs verify-url .hosting-release "$GITHUB_SHA" https://mahjong-lincoln.web.app/
